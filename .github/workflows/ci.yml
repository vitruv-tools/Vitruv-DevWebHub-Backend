name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  verify:
    name: Verify build and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vitruvius-server-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Override the datasource of application-test.yaml (adjust if your config differs)
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/vitruvius-server-test
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Java and Maven cache
        uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          check-latest: true
          cache: 'maven'

      - name: Install VsumProvider
        run: >
          ./mvnw install -pl VsumProvider -am
          -DskipTests
          --batch-mode
          --no-transfer-progress

      - name: Verify build
        run: >
          ./mvnw clean verify
          --batch-mode
          --update-snapshots
          --no-transfer-progress

      - name: Stage build results
        run: mkdir staging && find . -path '*/target/*.jar' -not -path './staging/*' -exec cp {} staging/ \;

      - name: Upload build results
        uses: actions/upload-artifact@v7
        with:
          name: build-results
          path: staging/

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/target/surefire-reports/'

  verify-javadoc:
    name: Verify JavaDoc
    runs-on: ubuntu-latest
    needs: [ verify ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Java and Maven cache
        uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          check-latest: true
          cache: 'maven'

      - name: Install VsumProvider
        run: >
          ./mvnw install -pl VsumProvider -am
          -DskipTests --batch-mode --no-transfer-progress

      - name: Verify JavaDoc
        run: >
          ./mvnw clean compile javadoc:javadoc
          -DskipTests
          --batch-mode
          --update-snapshots
          --no-transfer-progress

  sonar:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: [ verify ]
    if: github.event_name == 'schedule' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vitruvius-server-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/vitruvius-server-test
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0   # Sonar needs full history for blame/new code detection

      - name: Setup Java and Maven cache
        uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          check-latest: true
          cache: 'maven'

      - name: Install VsumProvider
        run: >
          ./mvnw install -pl VsumProvider -am
          -DskipTests --batch-mode --no-transfer-progress

      - name: Build, test and analyze
        run: >
          ./mvnw clean verify sonar:sonar -P coverage
          --batch-mode
          --update-snapshots
          --no-transfer-progress
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  run-checkstyle:
    name: Checkstyle check
    runs-on: ubuntu-latest
    needs: [ verify ]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && vars.RUN_CHECKSTYLE != 'false' }}
    strategy:
      fail-fast: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Run checkstyle
        uses: dbelyaev/action-checkstyle@v4.4.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          checkstyle_config: checkstyle.xml
          checkstyle_version: "10.21.4"

  package:
    name: Package application
    runs-on: ubuntu-latest
    needs: [ verify ]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository_owner == 'vitruv-tools'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Java and Maven cache
        uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          check-latest: true
          cache: 'maven'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Install VsumProvider
        run: >
          ./mvnw install -pl VsumProvider -am
          -DskipTests --batch-mode --no-transfer-progress

      - name: Build executable JAR
        run: >
          ./mvnw clean package
          -DskipTests
          --batch-mode
          --update-snapshots
          --no-transfer-progress

      - name: Deploy snapshot
        run: >
          ./mvnw clean deploy -P snapshot
          -DskipTests
          --batch-mode
          --update-snapshots
          --no-transfer-progress
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
