name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write   # needed to attach the JAR to the GitHub release

jobs:
  verify:
    name: Verify build and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vitruvius-server-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/vitruvius-server-test
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Java and Maven cache
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
          check-latest: true
          cache: 'maven'

      - name: Install VsumProvider
        run: >
          ./mvnw -f VsumProvider/pom.xml install
          -DskipTests --batch-mode --no-transfer-progress

      - name: Verify build
        run: >
          ./mvnw clean verify
          --batch-mode
          --update-snapshots
          --no-transfer-progress

  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    needs: [verify]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Java and Maven cache
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
          check-latest: true
          cache: 'maven'

      - name: Install VsumProvider
        run: >
          ./mvnw -f VsumProvider/pom.xml install
          -DskipTests --batch-mode --no-transfer-progress

      - name: Build executable JAR
        run: >
          ./mvnw clean package
          -DskipTests
          --batch-mode
          --update-snapshots
          --no-transfer-progress

      - name: Attach JAR to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" target/VitruviusServer-*.jar --clobber

      - name: Upload JAR as artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: VitruviusServer-release
          path: target/VitruviusServer-*.jar