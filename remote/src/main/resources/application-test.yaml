server:
  servlet:
    context-path: /api

spring:
  application:
    name: VitruviusServer
  http:
    converters:
      preferred-json-mapper: jackson2

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    # In-memory, so tests need no running database (CI included) and create-drop
    # never touches the developer/runtime VSUM list.
    username: sa
    password:
    url: jdbc:h2:mem:vitruvius-server-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: false

logging:
  file:
    name: ./remote/src/test/resources/logs/vitruvius-server.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 50
  level:
    root: info

app:
  vsums:
    vsum-providers-dir: ./remote/src/test/resources/vsum-providers
    vsum-provider-jar: vsum-provider.jar
    vsum-provider-lib-dir-name: lib
    vsum-storage-dir: ./remote/src/test/resources/vsum-storage
